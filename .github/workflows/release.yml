name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (aarch64)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm via corepack
        run: corepack enable && corepack install

      - name: Install system deps
        run: |
          brew install openconnect

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target aarch64-apple-darwin

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="src-tauri/target/release/bundle/macos/GP OpenUI.app.zip"
          dmg="src-tauri/target/release/bundle/dmg/GP OpenUI_*.dmg"
          if [ -f "$app" ]; then
            gh release upload "${{ github.ref_name }}" "$app" --clobber
          fi
          for f in $dmg; do
            [ -f "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
